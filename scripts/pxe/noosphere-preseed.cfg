# Noosphere automated install preseed (Debian 13 / trixie, amd64)
#
# Template - setup-pxe.sh replaces @@SERVER_IP@@ when staging to
# /var/lib/noosphere/netboot/noosphere-preseed.cfg
#
# WARNING: this WIPES the entire target disk and installs Noosphere onto it.

### Localization
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

### Network
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string noosphere
d-i netcfg/get_domain string local
d-i netcfg/hostname string noosphere
# Don't fuss if there's no DHCP DNS - the Noosphere LAN is offline
d-i netcfg/dhcp_timeout string 60
d-i netcfg/dhcpv6_timeout string 10

### Mirror / apt
# Installer pulls base packages from the Noosphere server's offline apt cache
# when available; falls back to deb.debian.org if the box happens to be online.
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

### Clock
d-i clock-setup/utc boolean true
d-i time/zone string America/Indiana/Indianapolis
d-i clock-setup/ntp boolean false

### Partitioning - WIPES THE WHOLE DISK, single root + swap
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-auto/disk string /dev/sda /dev/nvme0n1 /dev/vda
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

### Base system
d-i base-installer/install-recommends boolean false
d-i base-installer/kernel/image string linux-image-amd64

### Accounts - root password matches noosphere-provision.sh default ("noosphere"). CHANGE IT after first boot.
d-i passwd/root-login boolean true
d-i passwd/root-password password noosphere
d-i passwd/root-password-again password noosphere
d-i passwd/make-user boolean false

### Package selection - minimal + just enough for provisioning to take over
tasksel tasksel/first multiselect standard
d-i pkgsel/include string openssh-server curl wget git ca-certificates
d-i pkgsel/upgrade select none
popularity-contest popularity-contest/participate boolean false

### Bootloader
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string default

### Finish
d-i finish-install/reboot_in_progress note

### Late command
# Fetch noosphere-provision.sh from the Noosphere server over HTTP and register
# a first-boot service that runs it once (mirrors install-to-disk.sh).
# Note: this is ONE logical value continued with trailing backslashes. The unit
# file is written with printf (not a heredoc) because heredocs/real newlines
# cannot survive a single-line preseed value - printf expands the \n escapes.
d-i preseed/late_command string \
    in-target sh -c "wget -O /root/noosphere-provision.sh http://@@SERVER_IP@@/netboot/noosphere-provision.sh && chmod 0755 /root/noosphere-provision.sh"; \
    in-target sh -c "printf '[Unit]\nDescription=Noosphere First-Boot Provisioning\nAfter=network-online.target\nWants=network-online.target\nConditionPathExists=/root/noosphere-provision.sh\n\n[Service]\nType=oneshot\nExecStart=/bin/bash /root/noosphere-provision.sh --unattended\nExecStartPost=/bin/systemctl disable noosphere-firstboot.service\nStandardOutput=journal+console\nRemainAfterExit=yes\nTimeoutStartSec=3600\n\n[Install]\nWantedBy=multi-user.target\n' > /etc/systemd/system/noosphere-firstboot.service"; \
    in-target systemctl enable noosphere-firstboot.service
