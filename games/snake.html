<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Snake — Noosphere</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:sans-serif;background:#1a1a2e;color:#eee;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:1rem;touch-action:none}
h2{color:#e94560;margin-bottom:.5rem}
#scorebar{display:flex;gap:2rem;margin-bottom:.75rem;font-size:.95rem;color:#aaa}
#scorebar span{color:#eee;font-weight:bold}
canvas{border:2px solid #e94560;border-radius:4px;display:block;background:#0f0f1a}
#msg{margin-top:1rem;font-size:1.1rem;color:#e94560;min-height:1.5em;text-align:center}
.btns{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.75rem;justify-content:center}
button{background:#16213e;border:1px solid #e94560;color:#eee;padding:8px 18px;border-radius:6px;font-size:.9rem;cursor:pointer;transition:.15s}
button:hover{background:#e94560}
.dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px);gap:4px;margin-top:.75rem}
.dpad button{width:52px;height:52px;font-size:1.3rem;padding:0}
.back{margin-top:1.2rem;font-size:.85rem}
.back a{color:#555;text-decoration:none;border:1px solid #333;padding:4px 12px;border-radius:5px}
.back a:hover{color:#e94560;border-color:#e94560}
</style>
</head>
<body>
<h2>🐍 Snake</h2>
<div id="scorebar">Score: <span id="sc">0</span> &nbsp; Best: <span id="hi">0</span></div>
<canvas id="c" width="360" height="360"></canvas>
<div id="msg">Press Start or tap Play</div>
<div class="btns">
  <button id="startBtn">▶ Play</button>
  <button id="pauseBtn" disabled>⏸ Pause</button>
</div>
<div class="dpad">
  <div></div><button id="bu">▲</button><div></div>
  <button id="bl">◀</button><div></div><button id="br">▶</button>
  <div></div><button id="bd">▼</button><div></div>
</div>
<div class="back"><a href="/games/">← Games</a></div>
<script>
const C=document.getElementById('c'),ctx=C.getContext('2d');
const CELL=18,COLS=20,ROWS=20;
C.width=COLS*CELL;C.height=ROWS*CELL;
let snake,dir,next,food,score,best,loop,paused,running;
best=+localStorage.getItem('snake_best')||0;
document.getElementById('hi').textContent=best;

function rand(n){return Math.floor(Math.random()*n)}
function newFood(){
  let f;
  do{f={x:rand(COLS),y:rand(ROWS)}}while(snake.some(s=>s.x===f.x&&s.y===f.y));
  return f;
}
function init(){
  snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir={x:1,y:0};next={x:1,y:0};
  food=newFood();score=0;
  document.getElementById('sc').textContent=0;
  document.getElementById('msg').textContent='';
}
function draw(){
  ctx.fillStyle='#0f0f1a';ctx.fillRect(0,0,C.width,C.height);
  // grid
  ctx.strokeStyle='#1a1a2e';ctx.lineWidth=.5;
  for(let x=0;x<COLS;x++){ctx.beginPath();ctx.moveTo(x*CELL,0);ctx.lineTo(x*CELL,C.height);ctx.stroke()}
  for(let y=0;y<ROWS;y++){ctx.beginPath();ctx.moveTo(0,y*CELL);ctx.lineTo(C.width,y*CELL);ctx.stroke()}
  // food
  ctx.fillStyle='#e94560';ctx.beginPath();
  ctx.arc(food.x*CELL+CELL/2,food.y*CELL+CELL/2,CELL/2-2,0,Math.PI*2);ctx.fill();
  // snake
  snake.forEach((s,i)=>{
    ctx.fillStyle=i===0?'#2ecc71':'#27ae60';
    ctx.fillRect(s.x*CELL+1,s.y*CELL+1,CELL-2,CELL-2);
  });
}
function step(){
  if(paused)return;
  dir=next;
  const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS||snake.some(s=>s.x===head.x&&s.y===head.y)){
    endGame();return;
  }
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){
    score++;document.getElementById('sc').textContent=score;
    food=newFood();
  }else{snake.pop()}
  draw();
}
function endGame(){
  clearInterval(loop);running=false;
  if(score>best){best=score;localStorage.setItem('snake_best',best);document.getElementById('hi').textContent=best}
  document.getElementById('msg').textContent=`Game over! Score: ${score}`;
  document.getElementById('startBtn').disabled=false;
  document.getElementById('pauseBtn').disabled=true;
}
function startGame(){
  if(loop)clearInterval(loop);
  init();draw();running=true;paused=false;
  loop=setInterval(step,130);
  document.getElementById('startBtn').disabled=true;
  document.getElementById('pauseBtn').disabled=false;
  document.getElementById('pauseBtn').textContent='⏸ Pause';
}
document.getElementById('startBtn').onclick=startGame;
document.getElementById('pauseBtn').onclick=function(){
  if(!running)return;
  paused=!paused;
  this.textContent=paused?'▶ Resume':'⏸ Pause';
  document.getElementById('msg').textContent=paused?'Paused':'';
};

const dirs={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0},
            w:{x:0,y:-1},s:{x:0,y:1},a:{x:-1,y:0},d:{x:1,y:0},
            W:{x:0,y:-1},S:{x:0,y:1},A:{x:-1,y:0},D:{x:1,y:0}};
document.addEventListener('keydown',e=>{
  if(dirs[e.key]){
    const d=dirs[e.key];
    if(d.x!==-dir.x||d.y!==-dir.y)next=d;
    e.preventDefault();
  }
  if(e.key===' '){if(!running)startGame();else{paused=!paused;document.getElementById('pauseBtn').textContent=paused?'▶ Resume':'⏸ Pause';document.getElementById('msg').textContent=paused?'Paused':'';}e.preventDefault();}
});
document.getElementById('bu').onclick=()=>{if(next.y!==1)next={x:0,y:-1}};
document.getElementById('bd').onclick=()=>{if(next.y!==-1)next={x:0,y:1}};
document.getElementById('bl').onclick=()=>{if(next.x!==1)next={x:-1,y:0}};
document.getElementById('br').onclick=()=>{if(next.x!==-1)next={x:1,y:0}};

// touch swipe
let tx=0,ty=0;
C.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},false);
C.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>Math.abs(dy)){
    if(dx>20&&next.x!==-1)next={x:1,y:0};
    else if(dx<-20&&next.x!==1)next={x:-1,y:0};
  }else{
    if(dy>20&&next.y!==-1)next={x:0,y:1};
    else if(dy<-20&&next.y!==1)next={x:0,y:-1};
  }
},false);
draw();
</script>
</body>
</html>
