server {
    listen 80 default_server;
    server_name _;

    include snippets/security-headers.conf;

    # Captive portal detection endpoints
    location = /hotspot-detect.html       { return 302 http://192.168.8.2/; }
    location = /library/test/success.html { return 302 http://192.168.8.2/; }
    location = /generate_204              { return 302 http://192.168.8.2/; }
    location = /gen_204                   { return 302 http://192.168.8.2/; }
    location = /connecttest.txt           { return 302 http://192.168.8.2/; }
    location = /ncsi.txt                  { return 302 http://192.168.8.2/; }
    location = /success.txt               { return 302 http://192.168.8.2/; }

    # Block dotfiles
    location ~ /\. { deny all; }

    # Homepage
    location = / {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/noosphere/index.php;
        include fastcgi_params;
    }
    location /static/ {
        root /var/www/noosphere;
    }

    location /shared/ {
        root /var/www/noosphere;
        expires 7d;
        location ~ \.php$ { deny all; }
    }

    # Admin panel
    location /admin/ {
        root /var/www/noosphere;
        index index.php;
        location ~ ^/admin/scripts/ {
            root /var/www/noosphere;
            include snippets/security-headers.conf;
            add_header Content-Disposition 'attachment' always;
            location ~ \.php$ { deny all; }
        }
        location ~ ^/admin/.+\.php$ {
            fastcgi_pass unix:/run/php/php8.4-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
    }

    # Task Board
    location /tasks/ {
        root /var/www/noosphere;
        index index.php;
        location ~ ^/tasks/.*\.php$ {
            fastcgi_pass unix:/run/php/php8.4-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
    }

    # Community Registry
    location /registry/ {
        root /var/www/noosphere;
        index index.php;
        client_max_body_size 6M;
        location /registry/photos/ {
            alias /var/lib/noosphere/registry_photos/;
            expires 7d;
            location ~ \.php$ { deny all; }
        }
        location ~ \.php$ {
            fastcgi_pass unix:/run/php/php8.4-fpm.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
            client_max_body_size 6M;
        }
    }

    # Chat
    location /chat/ {
        root /var/www/noosphere;
        index index.php;
        location ~ ^/chat/.*\.php$ {
            fastcgi_pass unix:/run/php/php8.4-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
    }

    # Forum
    location /forum/ {
        root /var/www/noosphere;
        index index.php;
        location ~ ^/forum/.*\.php$ {
            fastcgi_pass unix:/run/php/php8.4-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
    }

    # Calendar
    location /calendar/ {
        root /var/www/noosphere;
        index index.php;
        location ~ ^/calendar/.*\.php$ {
            fastcgi_pass unix:/run/php/php8.4-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
    }

    # Files — upload/listing UI
    location /files/ {
        root /var/www/noosphere;
        index index.php;
        client_max_body_size 100M;
        location ~ ^/files/.*\.php$ {
            fastcgi_pass unix:/run/php/php8.4-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
            client_max_body_size 100M;
        }
    }

    # External drive files — direct download (NO PHP execution)
    location /files/ext/ {
        alias /media/noosphere-ext/files/;
        include snippets/security-headers.conf;
        add_header Content-Disposition 'attachment' always;
        location ~ \.php$ { deny all; }
    }

    # Files — direct download from storage (NO PHP execution)
    location /files/dl/ {
        alias /var/lib/noosphere/files/;
        include snippets/security-headers.conf;
        add_header Content-Disposition 'attachment' always;
        location ~ \.php$ { deny all; }
    }

    # Weather Log
    location /weather/ {
        root /var/www/noosphere;
        index index.php;
        location ~ ^/weather/.*\.php$ {
            fastcgi_pass unix:/run/php/php8.4-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
    }

    # Radio Net Log
    location /radio/ {
        root /var/www/noosphere;
        index index.php;
        location ~ ^/radio/.*\.php$ {
            fastcgi_pass unix:/run/php/php8.4-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
    }

    # Runner Board
    location /runners/ {
        root /var/www/noosphere;
        index index.php;
        location ~ ^/runners/.*\.php$ {
            fastcgi_pass unix:/run/php/php8.4-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
    }

    location /triage/ {
        root /var/www/noosphere;
        index index.php;
        location ~ ^/triage/.*\.php$ {
            fastcgi_pass unix:/run/php/php8.4-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
    }

    # Tile server
    location /tiles/ {
        proxy_pass http://127.0.0.1:8889/services/;
        proxy_set_header Host $host;
        include snippets/security-headers.conf;
        add_header Access-Control-Allow-Origin * always;
    }

    # Kiwix offline library
    location /library/ {
        proxy_pass http://127.0.0.1:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Topo maps module
    location /topo/ {
        root /var/www/noosphere;
        index index.php;
        location ~ ^/topo/.*\.php$ {
            fastcgi_pass unix:/run/php/php8.4-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
    }

    # Map glyph fonts
    location /maps/fonts/ {
        root /var/www/noosphere;
        include snippets/security-headers.conf;
        add_header Access-Control-Allow-Origin * always;
        expires 30d;
    }

    # Maps
    location /maps/ {
        index index.php;
        root /var/www/noosphere;
        include snippets/security-headers.conf;
        add_header Access-Control-Allow-Origin * always;
        add_header Accept-Ranges bytes always;
        location ~ ^/maps/.+\.php$ {
            fastcgi_pass unix:/run/php/php8.4-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
    }

    # Marker photos (NO PHP execution)
    location /marker-photos/ {
        alias /var/lib/noosphere/marker_photos/;
        include snippets/security-headers.conf;
        add_header Content-Disposition 'inline' always;
        expires 7d;
        location ~ \.php$ { deny all; }
    }
}
