server {
    listen 80 default_server;
    server_name _;

    include snippets/security-headers.conf;

    # Captive portal detection endpoints
    location = /hotspot-detect.html       { return 302 http://noosphere.net/; }
    location = /library/test/success.html { return 302 http://noosphere.net/; }
    location = /generate_204              { return 302 http://noosphere.net/; }
    location = /gen_204                   { return 302 http://noosphere.net/; }
    location = /connecttest.txt           { return 302 http://noosphere.net/; }
    location = /ncsi.txt                  { return 302 http://noosphere.net/; }
    location = /success.txt               { return 302 http://noosphere.net/; }

    # Block dotfiles
    location ~ /\. { deny all; }

    # Homepage
    location = / {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/noosphere/index.php;
        include fastcgi_params;
    }
    location /static/ {
        root /var/www/noosphere;
    }

    location /shared/ {
        root /var/www/noosphere;
        expires 7d;
        location ~ \.php$ { deny all; }
    }

    # Admin panel
    location /admin/ {
        root /var/www/noosphere;
        index index.php;
        location ~ ^/admin/scripts/ {
            root /var/www/noosphere;
            include snippets/security-headers.conf;
            add_header Content-Disposition 'attachment' always;
            location ~ \.php$ { deny all; }
        }
        location ~ ^/admin/.+\.php$ {
            fastcgi_pass unix:/run/php/php8.4-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
    }

    # Task Board
    location /tasks/ {
        root /var/www/noosphere;
        index index.php;
        location ~ ^/tasks/.*\.php$ {
            fastcgi_pass unix:/run/php/php8.4-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
    }

    # Community Registry
    location /registry/ {
        root /var/www/noosphere;
        index index.php;
        client_max_body_size 6M;
        location /registry/photos/ {
            alias /var/lib/noosphere/registry_photos/;
            expires 7d;
            location ~ \.php$ { deny all; }
        }
        location ~ \.php$ {
            fastcgi_pass unix:/run/php/php8.4-fpm.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
            client_max_body_size 6M;
        }
    }

    # Chat
    location /chat/ {
        root /var/www/noosphere;
        index index.php;
        location ~ ^/chat/.*\.php$ {
            fastcgi_pass unix:/run/php/php8.4-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
    }

    # Forum
    location /forum/ {
        root /var/www/noosphere;
        index index.php;
        location ~ ^/forum/.*\.php$ {
            fastcgi_pass unix:/run/php/php8.4-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
    }

    # Calendar
    location /calendar/ {
        root /var/www/noosphere;
        index index.php;
        location ~ ^/calendar/.*\.php$ {
            fastcgi_pass unix:/run/php/php8.4-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
    }

    # Files — upload/listing UI
    location /files/ {
        root /var/www/noosphere;
        index index.php;
        client_max_body_size 100M;
        location ~ ^/files/.*\.php$ {
            fastcgi_pass unix:/run/php/php8.4-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
            client_max_body_size 100M;
        }
    }

    # External drive files — direct download (NO PHP execution)
    location /files/ext/ {
        alias /media/noosphere-ext/files/;
        include snippets/security-headers.conf;
        add_header Content-Disposition 'attachment' always;
        location ~ \.php$ { deny all; }
    }

    # Files — direct download from storage (NO PHP execution)
    location /files/dl/ {
        alias /var/lib/noosphere/files/;
        include snippets/security-headers.conf;
        add_header Content-Disposition 'attachment' always;
        location ~ \.php$ { deny all; }
    }

    # Weather Log
    location /weather/ {
        root /var/www/noosphere;
        index index.php;
        location ~ ^/weather/.*\.php$ {
            fastcgi_pass unix:/run/php/php8.4-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
    }

    # Radio Net Log
    location /radio/ {
        root /var/www/noosphere;
        index index.php;
        location ~ ^/radio/.*\.php$ {
            fastcgi_pass unix:/run/php/php8.4-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
    }

    # Runner Board
    location /runners/ {
        root /var/www/noosphere;
        index index.php;
        location ~ ^/runners/.*\.php$ {
            fastcgi_pass unix:/run/php/php8.4-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
    }


    location /games/ {
        root /var/www/noosphere;
        index index.php;
        location ~ ^\/games\/.+\.php$ {
            fastcgi_pass unix:/run/php/php8.4-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
    }

    location /wiki/ {
        root /var/www/noosphere;
        index index.php;
        location ~ ^/wiki/.+.php$ {
            fastcgi_pass unix:/run/php/php8.4-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
    }

    location /triage/ {
        root /var/www/noosphere;
        index index.php;
        location ~ ^/triage/.*\.php$ {
            fastcgi_pass unix:/run/php/php8.4-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
    }

    # Tile server
    location /tiles/ {
        proxy_pass http://127.0.0.1:8889/services/;
        proxy_set_header Host $host;
        include snippets/security-headers.conf;
        add_header Access-Control-Allow-Origin * always;
    }

    # Kiwix offline library
    location /library/ {
        proxy_pass http://127.0.0.1:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Topo maps module
    location /topo/ {
        root /var/www/noosphere;
        index index.php;
        location ~ ^/topo/.*\.php$ {
            fastcgi_pass unix:/run/php/php8.4-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
    }

    # Map glyph fonts
    location /maps/fonts/ {
        root /var/www/noosphere;
        include snippets/security-headers.conf;
        add_header Access-Control-Allow-Origin * always;
        expires 30d;
    }

    # Maps
    location /maps/ {
        index index.php;
        root /var/www/noosphere;
        include snippets/security-headers.conf;
        add_header Access-Control-Allow-Origin * always;
        add_header Accept-Ranges bytes always;
        location ~ ^/maps/.+\.php$ {
            fastcgi_pass unix:/run/php/php8.4-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
    }

    # Marker photos (NO PHP execution)
    location /marker-photos/ {
        alias /var/lib/noosphere/marker_photos/;
        include snippets/security-headers.conf;
        add_header Content-Disposition 'inline' always;
        expires 7d;
        location ~ \.php$ { deny all; }
    }

    # Retired damage module \xe2\x86\x92 incidents
    location ^~ /damage { return 301 /incidents/?type=damage; }

    # Incidents module
    location /incidents/ {
        root /var/www/noosphere;
        index index.php;
        client_max_body_size 6M;
        include snippets/security-headers.conf;
        location ~ ^/incidents/.*\.php$ {
            fastcgi_pass unix:/run/php/php8.4-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
    }

    # Incident photos (NO PHP execution)
    location /incident-photos/ {
        alias /var/lib/noosphere/incident_photos/;
        include snippets/security-headers.conf;
        add_header Content-Disposition 'inline' always;
        expires 7d;
        location ~ \.php$ { deny all; }
    }

    # Resources hub
    location /resources/ {
        root /var/www/noosphere;
        index index.php;
        location ~ ^/resources/.*.php$ {
            fastcgi_pass unix:/run/php/php8.4-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
    }

    location /supplies/ {
        root /var/www/noosphere;
        index index.php;
        location ~ ^/supplies/.*.php$ {
            fastcgi_pass unix:/run/php/php8.4-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
    }

    location /seeds/ {
        root /var/www/noosphere;
        index index.php;
        location ~ ^/seeds/.*.php$ {
            fastcgi_pass unix:/run/php/php8.4-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
    }

    location /tools/ {
        root /var/www/noosphere;
        index index.php;
        location ~ ^/tools/.*.php$ {
            fastcgi_pass unix:/run/php/php8.4-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
    }
}

# ── HTTPS captive portal interception (no SSL) ───────────────────────────────
# Listens on port 443 WITHOUT ssl — sends a plain HTTP redirect before any TLS
# handshake occurs. Browsers receive the 302 and follow to the HTTP portal.
# This avoids self-signed cert warnings entirely (no handshake = no cert check),
# and works with Firefox which blocks HSTS exceptions for cert errors.
server {
    listen 443 default_server;
    server_name _;

    # Everything on port 443 → redirect to HTTP portal (no SSL negotiation)
    return 302 http://noosphere.net/;
}
